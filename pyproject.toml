[project]
name = "devlens"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "abzdevng", email = "azeezabraham7@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "pytest>=9.1.1",
]

[tool.pyrefly]
project-includes = [
    "**/*.py*",
    "**/*.ipynb",
]

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyrefly>=1.3.2",
    "ruff>=0.16.10",
]
[project.scripts]
devlens = "devlens.project:main"
